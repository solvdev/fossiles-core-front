<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planilla y Cargos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Concepto: un solo módulo con cuatro pestañas. Cada pantalla abre con lo que hay que hacer (siguiente paso, por decidir, con avisos)
   y deja el detalle a un clic en un panel lateral. Paleta heredada del sistema (turquesa Fossiles + colores de estado de planilla). */
:root {
  --bg: #f1f5f5; --surface: #ffffff; --surface-2: #f6f9f9; --ink: #172629; --muted: #566e72; --line: #dbe4e5; --line-strong: #c3d1d3;
  --accent: #12797f; --accent-ink: #ffffff; --accent-soft: #dff1f1; --accent-hover: #0e6469;
  --borrador-bg: #fff4e5; --borrador: #94550a; --aprobada-bg: #e6f5fa; --aprobada: #13708f;
  --pagada-bg: #e8f6ee; --pagada: #1d7a3b; --anulada-bg: #fdecec; --anulada: #b03a2e;
  --m1: #12797f; --m2: #5b7fc0; --m3: #d9a441; --shadow: 0 1px 2px rgba(23,38,41,.06), 0 6px 20px rgba(23,38,41,.06);
  --scrim: rgba(12,24,26,.45); --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Montserrat", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1819; --surface: #152224; --surface-2: #1a2a2c; --ink: #e6f0f0; --muted: #91acaf; --line: #263b3e; --line-strong: #35504f;
    --accent: #4fc3c8; --accent-ink: #072a2c; --accent-soft: #1b3d40; --accent-hover: #7bd6da;
    --borrador-bg: #3a2a12; --borrador: #f2b66a; --aprobada-bg: #123240; --aprobada: #7cc8e3;
    --pagada-bg: #143222; --pagada: #7fd39c; --anulada-bg: #3d1b19; --anulada: #f09a92;
    --m1: #4fc3c8; --m2: #86a6df; --m3: #e2b85f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1819; --surface: #152224; --surface-2: #1a2a2c; --ink: #e6f0f0; --muted: #91acaf; --line: #263b3e; --line-strong: #35504f;
  --accent: #4fc3c8; --accent-ink: #072a2c; --accent-soft: #1b3d40; --accent-hover: #7bd6da;
  --borrador-bg: #3a2a12; --borrador: #f2b66a; --aprobada-bg: #123240; --aprobada: #7cc8e3;
  --pagada-bg: #143222; --pagada: #7fd39c; --anulada-bg: #3d1b19; --anulada: #f09a92;
  --m1: #4fc3c8; --m2: #86a6df; --m3: #e2b85f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ribbon { background: var(--surface-2); border-bottom: 1px dashed var(--line-strong); font-size: 12px; color: var(--muted); }
.ribbon .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-block: 6px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
header.mod { padding-top: 22px; }
header.mod .wrap { display: flex; flex-direction: column; gap: 14px; }
.mod-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mod-title h1 { font-size: 22px; font-weight: 700; }
.mod-title span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.count { background: var(--borrador-bg); color: var(--borrador); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
main { padding-block: 22px 80px; display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card.pad { padding: 18px 20px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-head h2 { font-size: 15px; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; font-weight: 600; font-size: 13px; transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--anulada); border-color: var(--anulada); background: transparent; }
.btn.danger.solid { background: var(--anulada); color: var(--surface); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* estados */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.borrador { background: var(--borrador-bg); color: var(--borrador); } .pill.aprobada { background: var(--aprobada-bg); color: var(--aprobada); }
.pill.pagada { background: var(--pagada-bg); color: var(--pagada); } .pill.anulada { background: var(--anulada-bg); color: var(--anulada); }
.pill.neutral { background: var(--surface-2); color: var(--muted); } .pill.parcial { background: var(--aprobada-bg); color: var(--aprobada); }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; background: var(--borrador-bg); color: var(--borrador); white-space: nowrap; }
.tag.info { background: var(--aprobada-bg); color: var(--aprobada); } .tag.ok { background: var(--pagada-bg); color: var(--pagada); } .tag.bad { background: var(--anulada-bg); color: var(--anulada); }
/* paso a paso */
.steps { display: flex; align-items: center; }
.step { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 13px; }
.step i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.step.done { color: var(--pagada); } .step.done i { background: var(--pagada); border-color: var(--pagada); color: var(--surface); }
.step.now { color: var(--ink); } .step.now i { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step-line { width: 34px; height: 2px; background: var(--line-strong); margin: 0 8px; }
.step-line.done { background: var(--pagada); }
/* siguiente paso */
.next { display: flex; gap: 16px; align-items: center; padding: 16px 20px; border-radius: 12px; background: var(--aprobada-bg); color: var(--aprobada); flex-wrap: wrap; }
.next.aviso { background: var(--borrador-bg); color: var(--borrador); } .next.alerta { background: var(--anulada-bg); color: var(--anulada); }
.next.listo { background: var(--pagada-bg); color: var(--pagada); } .next.neutro { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.next .ico { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.next .txt { flex: 1; min-width: 220px; } .next b { display: block; font-size: 15px; font-family: var(--font-head); font-weight: 600; }
.next span.d { color: var(--ink); opacity: .82; font-size: 13px; }
/* resumen */
.summary { display: grid; grid-template-columns: 1.3fr 1fr 1.5fr 1fr; }
.summary > div { padding: 18px 20px; border-left: 1px solid var(--line); min-width: 0; }
.summary > div:first-child { border-left: 0; }
.lbl { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.big { font-family: var(--font-head); font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 4px; }
.mid { font-family: var(--font-head); font-size: 20px; font-weight: 600; margin-top: 4px; }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 10px 0 8px; gap: 2px; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.legend div { display: flex; gap: 8px; align-items: center; } .legend b { margin-left: auto; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
/* revisión */
.checks { list-style: none; margin: 0; padding: 4px 20px 14px; display: flex; flex-direction: column; }
.checks li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.checks li:first-child { border-top: 0; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.mark.ok { background: var(--pagada-bg); color: var(--pagada); } .mark.block { background: var(--anulada-bg); color: var(--anulada); }
.mark.warn { background: var(--borrador-bg); color: var(--borrador); } .mark.info { background: var(--aprobada-bg); color: var(--aprobada); }
.mark .ic { width: 13px; height: 13px; stroke-width: 2.4; }
.checks .t { flex: 1; min-width: 0; } .checks .t small { display: block; color: var(--muted); font-size: 12.5px; }
/* tablas */
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 20px; }
.search { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.input, select.input { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 11px; font: inherit; }
.search .input { padding-left: 33px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input.err { border-color: var(--anulada); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip em { font-style: normal; opacity: .75; font-weight: 500; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 9px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--surface-2); }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
td.net { font-weight: 700; }
.who { display: flex; gap: 10px; align-items: center; min-width: 190px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex: none; }
.who b { font-weight: 600; display: block; line-height: 1.25; } .who small { color: var(--muted); font-size: 12.5px; }
.pay { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; } .pay small { color: var(--muted); }
.delta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.empty { padding: 32px 20px; text-align: center; color: var(--muted); }
.flash { animation: flash 1.6s ease-out; } @keyframes flash { from { background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } * { transition: none !important; } }
/* próximos pagos */
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.next-pay { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.next-pay .when { font-family: var(--font-head); font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.facts div b { display: block; font-weight: 600; }
/* segmentado */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; padding: 2px; background: var(--surface-2); gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button:hover:not([disabled]) { color: var(--ink); }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }
.demo { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 5px 10px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* fichas y parámetros */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile:hover { border-color: var(--muted); } .tile[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tile b { display: block; font-family: var(--font-head); font-size: 22px; line-height: 1.2; } .tile span { color: var(--muted); font-size: 12.5px; }
.tile.warn b { color: var(--borrador); }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; align-items: start; }
.param { padding: 12px 20px; border-top: 1px solid var(--line); }
.param:first-of-type { border-top: 0; }
.param-top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.param-top .v { font-family: var(--font-head); font-size: 20px; font-weight: 700; }
.hist { margin: 10px 0 2px; padding: 0; list-style: none; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.hist li { padding-left: 14px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
/* cargos */
.decide { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 250px; }
.bulk { position: sticky; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 12px 12px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); }
.bulk .btn { background: var(--surface); color: var(--ink); }
.bulk .btn.ghost { background: transparent; color: var(--bg); border-color: transparent; text-decoration: underline; }
.decide .seg { flex-wrap: nowrap; } .decide .seg button { white-space: nowrap; }
td.desc { min-width: 180px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
/* capas */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.drawer header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding-top: max(18px, env(safe-area-inset-top, 0px)); }
.drawer .body { padding: 18px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
.drawer footer { padding: 14px 20px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: 14px; z-index: 51; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.modal + .x, .scrim.top { z-index: 50; }
.modal h3 { font-size: 17px; }
.field { display: flex; flex-direction: column; gap: 6px; } .field label, .field .fl { font-weight: 600; font-size: 13px; } .field small { color: var(--muted); }
.field .errmsg { color: var(--anulada); font-size: 12.5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dl { display: flex; flex-direction: column; } .dl div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.dl div:last-child { border-bottom: 0; } .dl .sec { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 14px; border-bottom: 0; }
.dl .tot { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 0; margin-top: 6px; padding-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-weight: 500; }
@media (max-width: 820px) {
  .summary { grid-template-columns: 1fr 1fr; } .summary > div { border-left: 0; border-top: 1px solid var(--line); } .summary > div:nth-child(-n+2) { border-top: 0; } .summary > div:nth-child(even) { border-left: 1px solid var(--line); }
  .two { grid-template-columns: 1fr; }
  .step span { display: none; } .step.now span { display: inline; }
}
@media (max-width: 520px) { .summary { grid-template-columns: 1fr; } .summary > div, .summary > div:nth-child(even) { border-left: 0; border-top: 1px solid var(--line) !important; } .summary > div:first-child { border-top: 0 !important; } }
</style>

  <div class="mod-title"><h1>Planilla</h1><span>Pagos quincenales, fichas, parámetros de ley y compras de colaboradores</span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const n2 = (n) => (Number(n) === 0 ? "—" : Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const q = (n) => "Q " + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  const compras = CHARGES.filter((c) => c.emp === e.id && c.reserved > 0).reduce((s, c) => s + c.reserved, 0);
  const net = r2(base + bonif - igss - isr - compras);

function linesTable(run) {

function cargosTable() {
  const { f, q: term } = S.ch; const t = term.trim().toLowerCase();
  const list = CHARGES.filter((c) => (f === "TODOS" || (f === "DECIDIR" && open(c) && !c.settle) || (f === "ABIERTOS" && open(c)) || c.status === f) && (!t || `${empOf(c.emp).name} ${c.desc}`.toLowerCase().includes(t)));
  const sel = list.filter((c) => open(c) && !c.settle && c.reserved === 0);
  return `<table><thead><tr><th style="width:36px">${sel.length ? `<input type="checkbox" data-act="selAll" aria-label="Seleccionar todos los que esperan decisión" ${sel.every((c) => S.ch.sel.has(c.id)) ? "checked" : ""}>` : ""}</th><th>Fecha</th><th>Colaborador</th><th>Descripción</th><th class="r">Monto</th><th class="r">Saldo</th><th>Cómo se cobra</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map((c) => {
    const e = empOf(c.emp); const o = open(c); const opts = options(c); const dr = S.ch.draft[c.id] ?? c.settle; const locked = c.reserved > 0;
    const editable = o && !locked && (opts.length > 1 || !c.settle);
    const decide = editable ? `<div class="decide"><div class="seg" role="radiogroup" aria-label="Cómo se cobra">${Object.keys(DEC).map((k) => `<button role="radio" aria-checked="${dr === k}" data-act="pick" data-id="${c.id}" data-v="${k}" ${opts.includes(k) ? "" : "disabled title='Planta se descuenta en planilla'"}>${k === "DESCUENTO" ? "Descuento" : DEC[k]}</button>`).join("")}</div>${dr && dr !== c.settle ? `<button class="btn primary sm" data-act="saveDec" data-id="${c.id}">Guardar</button>` : ""}</div>`
      : `<span>${c.settle ? DEC[c.settle] : "<span class='tag'>Sin decidir</span>"}</span>${locked ? `<div class="sub" style="font-size:12px">${ic("lock")} ${q(c.reserved)} en la planilla #44</div>` : ""}`;
    const stp = { PENDIENTE: ["borrador", "Pendiente"], PARCIAL: ["parcial", "Parcial"], PAGADO: ["pagada", "Pagado"], ANULADO: ["anulada", "Anulado"] }[c.status];
    return `<tr><td>${o && !c.settle && !locked ? `<input type="checkbox" data-act="sel" data-id="${c.id}" aria-label="Seleccionar cargo de ${esc(e.name)}" ${S.ch.sel.has(c.id) ? "checked" : ""}>` : ""}</td><td class="num">${fShort(c.date)}</td>
      <td><div class="who"><span class="av">${initials(e.name)}</span><div><b>${esc(e.name)}</b><small>${e.group === "PLANTA" ? "Planta" : "Administración"}${e.active ? "" : " · de baja"}</small></div></div></td>
      <td class="desc">${esc(c.desc)}</td><td class="r num">${n2(c.amount)}</td><td class="r num"><b>${n2(c.balance)}</b></td><td>${decide}</td><td><span class="pill ${stp[0]}">${stp[1]}</span></td>
      <td class="r" style="white-space:nowrap">${o && (c.settle === "TRANSFERENCIA" || c.settle === "EFECTIVO") ? `<button class="btn sm" data-act="askPaid" data-id="${c.id}">Marcar pagado</button> ` : ""}${o && c.balance === c.amount && !locked ? `<button class="btn sm ghost" data-act="askVoid" data-id="${c.id}">Anular</button>` : ""}</td></tr>`; }).join("") || `<tr><td colspan="9" class="empty">${f === "DECIDIR" ? "Nada espera decisión. Todo está al día." : "No hay cargos con ese filtro."}</td></tr>`}</tbody></table>`;
}
const bulkBar = () => `<div class="bulk" role="region" aria-label="Acciones en lote"><b>${S.ch.sel.size} seleccionado${S.ch.sel.size > 1 ? "s" : ""}</b><span class="spacer"></span><span>Decidir:</span>
  ${Object.keys(DEC).map((k) => `<button class="btn sm" data-act="bulk" data-v="${k}">${DEC[k]}</button>`).join("")}<button class="btn sm ghost" data-act="selNone">Quitar selección</button></div>`;

/* ---------- capas: drawer, modal, aviso ---------- */
function voucher(run, id) {
  const l = run.lines.find((x) => x.id === id); const e = empOf(id);
  const d = l.prev == null ? "Primera planilla de esta persona." : r2(l.net - l.prev) === 0 ? "Igual a la planilla anterior." : `${l.net > l.prev ? "Sube" : "Baja"} ${q(Math.abs(l.net - l.prev))} respecto a la anterior (${q(l.prev)}).`;
  return `<header><div class="who"><span class="av">${initials(l.name)}</span><div><h3 style="font-size:16px">${esc(l.name)}</h3><small class="sub">${esc(l.pos)} · Planilla #${run.id}</small></div></div><button class="btn ghost sm" data-act="closeDrawer" aria-label="Cerrar">${ic("x")}</button></header>
  <div class="body"><div><div class="lbl">Líquido a recibir</div><div class="big num">${q(l.net)}</div><div class="sub">${d}</div></div>
  <div class="dl num"><div class="sec">Devengado</div><div><span>Sueldo (${l.days} días)</span><b>${q(l.base)}</b></div><div><span>Bonificación incentivo</span><b>${q(l.bonif)}</b></div>
   <div class="sec">Deducciones</div><div><span>IGSS laboral (${PARAMS.igssL} %)</span><b>− ${q(l.igss)}</b></div><div><span>ISR</span><b>− ${q(l.isr)}</b></div>
   <div><span>Compras de colaborador ${l.compras ? `<button class="linkbtn" data-act="goCargos">ver</button>` : ""}</span><b>− ${q(l.compras)}</b></div>
   <div class="tot"><span>Líquido</span><span>${q(l.net)}</span></div></div>
  <div class="dl"><div class="sec">Pago</div><div><span>Forma de pago</span><b>${l.method ? METHOD[l.method].label : "Sin definir"}</b></div>
   ${l.method === "CHEQUE" ? `<div><span>Cheque</span><b class="num">${l.cheque || "Sin número"}</b></div>` : ""}${l.method === "TRANSFERENCIA" ? `<div><span>Cuenta</span><b class="num">${l.account ? "•••• " + l.account : "Sin cuenta"}</b></div>` : ""}</div></div>
  <footer>${e && run.status === "BORRADOR" ? `<button class="btn" data-act="editFicha" data-id="${id}">Editar ficha</button>` : ""}<button class="btn primary" data-act="closeDrawer">Listo</button></footer>`;
}
function layer() {
  let h = "";
  if (S.drawer) {
    const d = S.drawer; const run = S.runId ? runById(S.runId) : null;
    const body = d.type === "voucher" ? voucher(run, d.id) : d.type === "ficha" ? fichaDrawer(d) : paramDrawer(d);
    h += `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true">${body}</aside>`;
  }
  if (S.modal) {
    const m = S.modal;
    h += `<div class="scrim top" data-act="closeModal"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${m.title}</h3><div>${m.body}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn ${m.tone === "danger" ? "danger solid" : "primary"}" data-act="modalOk" id="modalOk">${m.ok}</button></div></div>`;
  }
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  const keep = document.activeElement && document.activeElement.id; $("#layer").innerHTML = h;
  if (keep) { const el = document.getElementById(keep); if (el && el.tagName === "INPUT") { el.focus(); try { const v = el.value; el.setSelectionRange(v.length, v.length); } catch (e) {} } }
}
const modal = (m) => { S.modal = m; layer(); const f = $(".modal input, .modal textarea"); if (f) f.focus(); };

function render() {
  renderTabs();
  $("#app").innerHTML = { planillas: viewRuns, planilla: viewRun, fichas: viewFichas, parametros: viewParams, cargos: viewCargos }[S.view]();
  layer();
}

/* ---------- acciones ---------- */
function recalc(run) { run.lines = linesFor(run.group, run.lines); const before = run.stale; run.stale = false; S.flash = new Set(run.lines.map((l) => l.id)); render(); toast(before ? "Recalculada con los datos vigentes." : "Recalculada: sin cambios."); setTimeout(() => { S.flash = new Set(); }, 1700); }
function openFicha(id) { const e = empOf(id); S.drawer = { type: "ficha", id, errs: {}, draft: { group: e.group, type: e.type, method: e.method, account: e.account, salary: e.salary, bonif: e.bonif ?? "", baja: e.active ? "" : "2026-11-01" } }; layer(); }
function toFichas(opts) { S.fi = { q: "", group: opts.group || "", type: "", warn: !!opts.warn, inactive: false }; go("fichas"); }
const ACT = {
  theme() { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; },
  go(d) { go(d.v); }, openRun(d) { go("planilla", d.id); }, rf(d) { S.rf = d.v; render(); }, pf(d) { S.pf = d.v; render(); }, cols() { S.cols = !S.cols; render(); },
  fake(d) { toast(d.t); }, closeDrawer() { S.drawer = null; layer(); }, closeModal() { S.modal = null; layer(); },
  voucher(d) { S.drawer = { type: "voucher", id: d.id }; layer(); },
  goFichas(d) { toFichas({ group: d.g }); }, fixMethod(d) { toFichas({ group: d.g, warn: true }); }, fixAcct(d) { toFichas({ group: d.g, warn: true }); }, goCargos() { S.ch.f = "ABIERTOS"; go("cargos"); },
  recalc() { recalc(runById(S.runId)); },
  jump(d) { const run = runById(S.runId); run.status = d.v; if (d.v === "PAGADA") { chequeAll(run.lines); run.paidAt = run.payDate; } if (d.v === "APROBADA") run.lines.forEach((l) => { l.cheque = ""; }); render(); },
  prepare(d) { const g = d.g || "PLANTA"; const id = Math.max(...RUNS.map((r) => r.id)) + 1;
    modal({ title: `Preparar planilla de ${GROUPS[g]}`, body: `<p class="sub">Pago del ${fLong(g === "PLANTA" ? "2026-11-20" : "2026-11-27")}. Se calcula con las fichas, los parámetros y las compras de colaborador vigentes, y queda en borrador para revisarla.</p>`, ok: "Preparar", onOk() { RUNS.unshift(mkRun(id, g, "BORRADOR", g === "PLANTA" ? "2026-11-20" : "2026-11-27", g === "PLANTA" ? "2026-11-06" : "2026-11-16", g === "PLANTA" ? "2026-11-20" : "2026-11-30")); S.modal = null; go("planilla", id); toast(`Planilla #${id} preparada en borrador.`); } }); },
  askApprove() { const run = runById(S.runId); modal({ title: `Aprobar planilla #${run.id}`, body: `<p class="sub">Los montos quedan fijos y se rebajan ${q(tot(run.lines, "compras"))} de compras de colaborador.</p>`, ok: "Aprobar", onOk() { run.status = "APROBADA"; run.lines.forEach((l) => { l.cheque = ""; }); CHARGES.forEach((c) => { if (c.reserved) { c.balance = r2(c.balance - c.reserved); c.reserved = 0; if (c.balance <= 0) c.status = "PAGADO"; } }); S.modal = null; render(); toast("Planilla aprobada."); } }); },
  askCheques() { const run = runById(S.runId); modal({ title: "Numerar cheques", body: `<p class="sub">Se numeran en orden alfabético desde este número. Puede volver a numerarlos antes de registrar el pago.</p><div class="field"><label for="m-first">Primer número de cheque</label><input class="input" id="m-first" value="99645508/GCF"></div><div class="field" style="margin-top:12px"><label for="m-bank">Banco</label><input class="input" id="m-bank" value="${esc(run.bank)}"></div>`, ok: "Numerar", onOk() { const v = ($("#m-first").value.match(/\d+/) || ["99645508"])[0]; chequeAll(run.lines, Number(v)); S.modal = null; render(); toast("Cheques numerados."); } }); },
  askPay() { const run = runById(S.runId); modal({ title: "Registrar pago", body: `<p class="sub">La planilla queda pagada y se genera su partida contable. Después no se puede anular.</p>`, ok: "Registrar pago", onOk() { run.status = "PAGADA"; run.paidAt = TODAY; S.modal = null; render(); toast("Pago registrado y partida generada."); } }); },
  askDate() { const run = runById(S.runId); modal({ title: "Fecha de pago", body: `<p class="sub">Se puede adelantar hasta 10 días, nunca después de la fecha programada. En borrador, la planilla se recalcula.</p><div class="field"><label for="m-date">Se paga el</label><input class="input" id="m-date" type="date" value="${run.payDate}" max="${run.sched}" min="2026-11-01"></div>`, ok: "Guardar", onOk() { const v = $("#m-date").value; if (v) run.payDate = v; S.modal = null; render(); toast("Fecha de pago actualizada."); } }); },
  askAnnul() { const run = runById(S.runId); modal({ title: "Anular planilla", tone: "danger", body: `<p class="sub">${run.status === "APROBADA" ? "Los descuentos de compras vuelven al saldo de cada colaborador. " : ""}La fecha queda libre para preparar otra.</p><div class="field"><label for="m-why">Motivo</label><textarea class="input" id="m-why" rows="3" maxlength="500"></textarea></div>`, ok: "Anular planilla", onOk() { const v = $("#m-why").value.trim(); if (!v) { toast("Escriba el motivo."); return false; } run.status = "ANULADA"; run.note = v; S.modal = null; render(); toast("Planilla anulada."); } }); },
  modalOk() { if (S.modal.onOk() === false) return; },
  /* fichas */
  fiTile(d) { const same = S.fi.group === d.g && S.fi.type === d.t; S.fi.group = same ? "" : d.g; S.fi.type = same ? "" : d.t; S.fi.warn = false; render(); },
  fiWarn() { S.fi.warn = !S.fi.warn; render(); },
  editFicha(d) { openFicha(d.id); },
  dset(d) { const x = S.drawer.draft; x[d.k] = d.v; if (d.k === "method" && S.drawer.errs) S.drawer.errs.method = ""; layer(); },
  saveFicha() { const D = S.drawer; const x = D.draft; const errs = {};
    if (!x.method) errs.method = "Indique la forma de pago."; if (x.method === "TRANSFERENCIA" && !String(x.account).trim()) errs.account = "Indique el número de cuenta para pagar por transferencia."; if (x.salary === "" || Number(x.salary) < 0) errs.salary = "Indique el salario mensual, de cero en adelante.";
    D.errs = errs; if (Object.keys(errs).length) { layer(); return; }
    const e = empOf(D.id); Object.assign(e, { group: x.group, type: x.type, method: x.method, account: x.method === "TRANSFERENCIA" ? String(x.account).trim().slice(-4) : "", salary: Number(x.salary), bonif: x.bonif === "" ? null : Number(x.bonif), active: !x.baja });
    RUNS.forEach((r) => { if (r.status === "BORRADOR" && r.group === e.group) r.stale = true; }); S.drawer = null; render(); toast(`Ficha de ${e.name} guardada. La planilla en borrador quedó por recalcular.`); },
  /* parámetros */
  hist(d) { S.hist[d.k] = !S.hist[d.k]; render(); },
  newParam() { S.drawer = { type: "param", errs: {}, draft: { code: "IGSS laboral", val: "", from: "", why: "" } }; layer(); },
  saveParam() { const D = S.drawer; const errs = {}; if (D.draft.val === "" || Number(D.draft.val) < 0) errs.val = "Indique un valor, de cero en adelante."; if (!D.draft.from) errs.from = "Indique desde qué fecha rige."; D.errs = errs; if (Object.keys(errs).length) { layer(); return; }
    const all = PGROUPS.flatMap((g) => g[1]).find((a) => a[0] === D.draft.code); all[2].unshift([Number(D.draft.val), D.draft.from, D.draft.why || "Sin motivo", true]); if (all[2][1]) all[2][1][3] = false; S.drawer = null; RUNS.forEach((r) => { if (r.status === "BORRADOR") r.stale = true; }); render(); toast("Valor registrado. Recalcule las planillas en borrador que lo usen."); },
  /* cargos */
  chf(d) { S.ch.f = d.v; S.ch.sel = new Set(); render(); },
  pick(d) { S.ch.draft[d.id] = d.v; render(); },
  saveDec(d) { const c = CHARGES.find((x) => x.id == d.id); c.settle = S.ch.draft[d.id]; delete S.ch.draft[d.id]; render(); toast("Decisión guardada."); },
  sel(d, ev) { ev.target.checked ? S.ch.sel.add(Number(d.id)) : S.ch.sel.delete(Number(d.id)); render(); },
  selAll(d, ev) { const rows = CHARGES.filter((c) => open(c) && !c.settle && c.reserved === 0); if (ev.target.checked) rows.forEach((c) => S.ch.sel.add(c.id)); else S.ch.sel = new Set(); render(); },
  selNone() { S.ch.sel = new Set(); render(); },
  bulk(d) { let ok = 0, skip = 0; S.ch.sel.forEach((id) => { const c = CHARGES.find((x) => x.id === id); if (options(c).includes(d.v)) { c.settle = d.v; ok++; } else skip++; }); S.ch.sel = new Set(); render(); toast(`${ok} cargo${ok === 1 ? "" : "s"} actualizado${ok === 1 ? "" : "s"}${skip ? `. ${skip} de planta se quedan en descuento.` : "."}`); },
  askPaid(d) { const c = CHARGES.find((x) => x.id == d.id); modal({ title: "Marcar como pagado", body: `<p class="sub">${esc(empOf(c.emp).name)} pagó ${q(c.balance)} por ${DEC[c.settle].toLowerCase()}.</p>`, ok: "Marcar pagado", onOk() { c.balance = 0; c.status = "PAGADO"; S.modal = null; render(); toast("Cargo saldado."); } }); },
  askVoid(d) { const c = CHARGES.find((x) => x.id == d.id); modal({ title: "Anular cargo", tone: "danger", body: `<p class="sub">Solo para cargos registrados por error: ${esc(c.desc)}, ${q(c.amount)}. No se puede deshacer.</p>`, ok: "Anular cargo", onOk() { c.status = "ANULADO"; c.balance = 0; S.modal = null; render(); toast("Cargo anulado."); } }); },
};
document.addEventListener("click", (ev) => { const el = ev.target.closest("[data-act]"); if (!el || el.matches("input[type=checkbox]")) return; ACT[el.dataset.act]?.(el.dataset, ev); });
document.addEventListener("change", (ev) => { const el = ev.target; if (el.matches("input[type=checkbox][data-act]")) ACT[el.dataset.act](el.dataset, ev); if (el.id === "fiG") { S.fi.group = el.value; render(); } if (el.id === "fiI") { S.fi.inactive = el.checked; render(); } });
document.addEventListener("input", (ev) => { const el = ev.target;
  if (el.id === "lineQ") { S.lineQ = el.value; $("#lines").innerHTML = linesTable(runById(S.runId)); }
  else if (el.id === "fiQ") { S.fi.q = el.value; $("#fiT").innerHTML = fichasTable(); }
  else if (el.id === "chQ") { S.ch.q = el.value; $("#chT").innerHTML = cargosTable(); }
  else if (el.dataset.in && S.drawer) { const k = el.dataset.in; S.drawer.draft[k] = el.value; } });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (S.modal) ACT.closeModal(); else if (S.drawer) ACT.closeDrawer(); } });
route();
</script>
